<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Anki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Indie+Flower&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
    <link rel="shortcut icon" href="icon/favicon.ico">
</head>
<body>
    <div id="updateBanner" style="display:none; position:fixed; top:0; left:0; width:100%; background:var(--anki-red); color:white; padding:15px; text-align:center; font-weight:bold; z-index:9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        Доступна нова версія! <button onclick="app.applyUpdate()" style="margin-left:15px; padding:6px 16px; border:none; background:white; color:var(--anki-red); font-weight:bold; border-radius:5px; cursor:pointer;">Оновити</button>
    </div>

    <header>
        <h1>My Personal Anki</h1>
        <div class="top-menu">
            <div class="top-btn" onclick="openModal('createOverlay')" title="Додати блокнот">
                <svg class="svg-icon plus-icon" viewBox="0 0 24 24"><path d="M10 2h4v8h8v4h-8v8h-4v-8h-8v-4h8z"/></svg>
            </div>
            <div class="top-btn" onclick="openModal('settingsOverlay')" title="Голос">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
                </svg>
            </div>
            <div class="top-btn" id="themeBtn" onclick="toggleTheme()" title="Тема">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </div>
        </div>
    </header>

    <div class="shelf" id="shelf"></div>

    <div class="modal-overlay" id="trainingOverlay" onclick="closeAllModals()">
        <div class="modal-content hand-drawn-border" onclick="event.stopPropagation()">
            <span class="close-x" onclick="closeAllModals()">✖</span>
            <h2 id="trainingTitle">Навчання</h2>
            
            <div class="counter-text">Залишилось: <span id="cardsLeft">0</span></div>
            <div class="progress-container"><div id="progressBar"></div></div>

            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="mainCard">
                    <div class="card-face hand-drawn-border">
                        <span class="card-hint">Клікніть, щоб перевернути</span>
                        <div class="txt-ua" id="cardUA">Переклад</div>
                        <div class="txt-code" id="cardCode">CODE</div>
                    </div>
                    <div class="card-face card-back hand-drawn-border">
                        <div class="txt-en" id="cardEN">Original</div>
                        <div class="txt-trans" id="cardTrans">[transcription]</div>
                        <button class="btn-speaker" onclick="event.stopPropagation(); speakCurrentCard();">
                            <svg class="svg-icon" style="width:20px; height:20px;" viewBox="0 0 24 24"><path d="M11 5L6 9H2V15H6L11 19V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div id="speechPanel" class="speech-panel">
                <div class="ptt-container">
                    <canvas class="audio-canvas"></canvas>
                    <button class="mic-btn round-mic">
                        <svg class="svg-icon" style="width:32px; height:32px;" viewBox="0 0 24 24">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                </div>
                <input type="text" class="speech-input admin-input" placeholder="Press and Hold to Speak..." readonly style="width: 100%; border:none; background:var(--input-bg); text-align:center;">
            </div>

            <div id="trainingActions" style="display:none; width: 100%;">
                <div class="training-controls">
                    <button class="anki-button btn-grade" style="color:var(--anki-red); border-color:var(--anki-red)" onclick="gradeCard(1)">Знову</button>
                    <button class="anki-button btn-grade" style="color:var(--anki-orange); border-color:var(--anki-orange)" onclick="gradeCard(2)">Важко</button>
                    <button class="anki-button btn-grade" style="color:var(--anki-blue); border-color:var(--anki-blue)" onclick="gradeCard(3)">Добре</button>
                    <button class="anki-button btn-grade" style="color:var(--anki-green); border-color:var(--anki-green)" onclick="gradeCard(4)">Легко</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsOverlay" onclick="closeAllModals()">
        <div class="modal-content hand-drawn-border" onclick="event.stopPropagation()">
            <span class="close-x" onclick="closeAllModals()">✖</span>
            <h2>Голос</h2>
            <div id="voiceSettingsContent">
                <div class="settings-row" style="margin-top: 10px;">
                    <label>Оберіть голос:</label>
                    <select id="voiceSelect" onchange="app.updateVoice(this.value)" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-family: inherit; margin-top: 5px; cursor: pointer;"></select>
                </div>
                <div class="settings-row">
                    <label>Швидкість: <span id="valRate">0.9</span></label>
                    <input type="range" min="0.5" max="1.5" step="0.1" id="inputRate" oninput="app.updateSpeechSetting('rate', this.value)">
                </div>
                <div class="settings-row">
                    <label>Тембр: <span id="valPitch">1.0</span></label>
                    <input type="range" min="0.5" max="1.5" step="0.1" id="inputPitch" oninput="app.updateSpeechSetting('pitch', this.value)">
                </div>
                <div class="settings-row">
                    <label>Поріг шуму: <span id="valNoise">20</span></label>
                    <input type="range" min="0" max="155" step="5" id="inputNoise" oninput="app.updateSpeechSetting('noiseThreshold', this.value)">
                </div>
                <div class="settings-row">
                    <label>Таймаут (сек): <span id="valTimeout">3</span></label>
                    <input type="range" min="1" max="7" step="1" id="inputTimeout" oninput="app.updateSpeechSetting('silenceTimeout', this.value)">
                </div>

                <!-- Live Tuning Panel (Minimal) -->
                <div class="speech-panel" style="margin-bottom: 20px;">
                    <div class="ptt-container">
                        <canvas class="audio-canvas" style="height:120px;"></canvas>
                        <button class="mic-btn round-mic" style="width:70px; height:70px; font-size:2rem;">
                            <svg class="svg-icon" style="width:32px; height:32px;" viewBox="0 0 24 24">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                <line x1="12" y1="19" x2="12" y2="23"/>
                                <line x1="8" y1="23" x2="16" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <input type="text" class="speech-input admin-input" placeholder="Voice testing..." readonly style="width: 100%; text-align:center; background:none; border:none;">
                </div>
            </div>

            <button class="anki-button" style="background:var(--anki-green); color:white;" onclick="closeAllModals()">Зберегти</button>
        </div>
    </div>

    <div class="modal-overlay" id="menuOverlay" onclick="closeAllModals()">
        <div class="modal-content hand-drawn-border" onclick="event.stopPropagation()">
            <span class="close-x" onclick="closeAllModals()">✖</span>
            <h2 id="menuTitle">Блокнот</h2>
            <button class="anki-button" style="background-color:var(--anki-blue); color:white;" onclick="startTraining()">🚀 Вчити</button>
            <button class="anki-button" onclick="openAdmin()">📝 Редагувати</button>
            <button id="syncBtn" class="anki-button" style="background-color:var(--anki-green); color:white; display:none;" onclick="document.getElementById('updateFileInput').click()">🔄 Оновити</button>
            <input type="file" id="updateFileInput" style="display:none" onchange="updateFromFile(event)">
            <button class="anki-button" style="color:var(--anki-red); border-color:var(--anki-red);" onclick="deleteCurrentNotebook()">🗑️ Видалити</button>
        </div>
    </div>

    <div class="modal-overlay" id="adminOverlay" onclick="closeAllModals()">
        <div class="modal-content hand-drawn-border" onclick="event.stopPropagation()">
            <span class="close-x" onclick="closeAllModals()">✖</span>
            <h2 id="adminTitle">Редагування</h2>
            <div id="adminCardsContainer"></div>
            <div style="margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:10px;">
                <button class="anki-button" onclick="insertCardRow()">➕ Додати рядок</button>
                <button class="anki-button" style="background-color:var(--anki-green); color:white;" onclick="saveAdminData()">💾 Зберегти</button>
                <button class="anki-button" style="color:var(--accent); border-color:var(--accent);" onclick="exportCurrentNotebook()">📤 Експорт JSON</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="createOverlay" onclick="closeAllModals()">
        <div class="modal-content hand-drawn-border" onclick="event.stopPropagation()">
            <span class="close-x" onclick="closeAllModals()">✖</span>
            <h2>Новий блокнот</h2>
            <button class="anki-button" onclick="addNotebook(false)">📝 Створити блокнот</button>
            <button class="anki-button" style="background-color:var(--anki-green); color:white;" onclick="document.getElementById('syncFileInput').click()">🔗 Прив'язати JSON</button>
            <input type="file" id="syncFileInput" style="display:none" accept=".json" onchange="addNotebookWithFile(event)">
        </div>
    </div>

    <!-- Dialog Overlay -->
    <div class="modal-overlay" id="dialogOverlay" style="z-index: 1000;" onclick="app.handleDialog(false)">
        <div class="modal-content hand-drawn-border dialog-modal" onclick="event.stopPropagation()">
            <p id="dialogMessage" style="font-size: 1.2rem; margin-bottom: 20px; white-space: pre-wrap; font-family: 'Gochi Hand';"></p>
            <input type="text" id="dialogInput" class="admin-input" style="display:none; margin-bottom: 20px; width: 100%;" placeholder="">
            <div class="training-controls" style="justify-content: center; gap: 20px;">
                <button id="dialogCancel" class="anki-button" style="color:var(--anki-red); border-color:var(--anki-red); background: none;" onclick="app.handleDialog(false)">Скасувати</button>
                <button id="dialogOk" class="anki-button" style="background-color:var(--anki-green); color:white;" onclick="app.handleDialog(true)">OK</button>
            </div>
        </div>
    </div>

    <footer style="text-align:center; padding: 20px; font-size: 0.9rem; color: var(--border-color); opacity: 0.8;">
        © <span id="currentYear"></span> Mykhailo Anisimov
    </footer>

    <script src="app.js"></script>
</body>
</html>
